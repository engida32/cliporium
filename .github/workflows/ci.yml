name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: dbus-run-session -- cargo test --workspace

  extension:
    # Packaging smoke test. The target GNOME 50 runtime check is manual until a
    # stable GitHub runner image ships GNOME 50.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GJS and packer
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin gnome-shell unzip
      - name: Check license copy
        run: cmp LICENSE extension/LICENSE
      - name: Validate metadata and schema
        run: python3 scripts/validate-metadata.py
      - name: Check JavaScript syntax
        run: |
          for file in extension/extension.js extension/prefs.js extension/src/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Compile schema
        run: glib-compile-schemas --strict extension/schemas
      - name: Unit tests
        run: |
          gjs -m tests/history.test.js
          gjs -m tests/storage.test.js
          gjs -m tests/display.test.js
          gjs -m tests/clipboard.test.js
          gjs -m tests/copy-payload.test.js
          gjs -m tests/image-store.test.js
          gjs -m tests/image-utils.test.js
          gjs -m tests/stylesheet.test.js
      - name: Headless UI probes
        run: |
          if ! gnome-shell --version | grep -q 'GNOME Shell 50'; then
            echo "Skipping headless probes: GNOME Shell 50 is required"
            exit 0
          fi
          bash tests/headless-toolbar-probe.sh
          bash tests/headless-pinned-probe.sh
          bash tests/headless-image-probe.sh
          CLIPORIUM_TEXT_SCALE=2.0 bash tests/headless-toolbar-probe.sh
      - name: Benchmark history model
        run: gjs -m tests/bench_history.js
      - name: Pack
        run: |
          mkdir -p dist
          gnome-extensions pack --force \
            --extra-source=src \
            --extra-source=LICENSE \
            --schema=schemas/org.gnome.shell.extensions.cliporium.gschema.xml \
            --out-dir=dist extension
      - name: Inspect package
        run: |
          pack="dist/cliporium@engida32.github.io.shell-extension.zip"
          unzip -l "$pack"
          for file in metadata.json extension.js prefs.js stylesheet.css LICENSE \
            schemas/org.gnome.shell.extensions.cliporium.gschema.xml \
            src/clipboard.js src/copy-payload.js src/display.js \
            src/history.js src/image-store.js src/image-utils.js \
            src/search.js src/storage.js; do
            unzip -Z1 "$pack" | grep -qx "$file"
          done
          if unzip -Z1 "$pack" | grep -E '(^|/)(target|Cargo\.|.*\.rs$|.*\.sqlite3$|history\.json$)'; then
            echo "package contains a development or data file" >&2
            exit 1
          fi
